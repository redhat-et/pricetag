---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maas-api
  namespace: ai-gateway-dogfood
  labels:
    app.kubernetes.io/name: maas-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maas-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maas-api
    spec:
      serviceAccountName: maas-api
      securityContext:
        runAsNonRoot: true
      containers:
        - name: maas-api
          image: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/maas-api:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 9090
              name: metrics
              protocol: TCP
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SECURE
              value: "false"
            - name: MAAS_SUBSCRIPTION_NAMESPACE
              value: "ai-gateway-dogfood"
            - name: METRICS_PORT
              value: "9090"
            - name: DEBUG_MODE
              value: "true"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: maas-api
  namespace: ai-gateway-dogfood
  labels:
    app.kubernetes.io/name: maas-api
spec:
  selector:
    app.kubernetes.io/name: maas-api
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
  type: ClusterIP
