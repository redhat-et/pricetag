---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metering-service
  namespace: ai-gateway-dogfood
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metering-service
  template:
    metadata:
      labels:
        app: metering-service
    spec:
      containers:
        - name: metering-service
          image: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/metering-service:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgresql-credentials
                  key: METERING_DB_URL
            - name: K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADMIN_USERS
              valueFrom:
                configMapKeyRef:
                  name: pricetag-config
                  key: ADMIN_USERS
            - name: SUPERADMIN_USERS
              valueFrom:
                configMapKeyRef:
                  name: pricetag-config
                  key: SUPERADMIN_USERS
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: pricetag-session
                  key: SESSION_SECRET
            - name: ALLOW_UNAUTHENTICATED_ADMIN
              value: "false"
            - name: PIPELINE_CONFIGMAP
              value: "praxis-config"
            - name: PIPELINE_CONFIGMAP_KEY
              value: "praxis.yaml"
            - name: WELCOME_GATEWAY_URL
              value: "${GATEWAY_URL}"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metering-service
  namespace: ai-gateway-dogfood
spec:
  selector:
    app: metering-service
  ports:
    - port: 8080
      targetPort: 8080
