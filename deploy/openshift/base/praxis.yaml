---
apiVersion: v1
kind: ConfigMap
metadata:
  name: praxis-config
  namespace: ai-gateway-dogfood
data:
  praxis.yaml: |
    admin:
      address: "127.0.0.1:9901"

    insecure_options: {}
    listeners:
      - name: openai
        address: "0.0.0.0:8081"
        filter_chains:
          - openai

      - name: benchmark
        address: "0.0.0.0:8082"
        filter_chains:
          - benchmark

      # The public ai-gateway hostname path-routes Anthropic Messages to this
      # listener and OpenAI Chat/Responses/Conversations to the openai listener.
      # Keep protocol-specific pipelines separate behind one public host.
      - name: unified
        address: "0.0.0.0:8084"
        filter_chains:
          - unified

    filter_chains:
      - name: openai
        filters:
          - filter: api_key_auth
            validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
            token_header: "authorization"
            cache_ttl_seconds: 300
            timeout_seconds: 5

          - filter: reject_upgrade
            # Refuse connection upgrades (e.g. WebSocket): Pingora tunnels a 101
            # opaquely, bypassing external_metering/token_count. Clients fall back
            # to plain HTTP where every request is metered. (metering accounting guard)
            protocols:
              - websocket

          - filter: model_access
            mode: denylist
            models:
            overrides:
              - groups: ["octo-eng"]
                mode: allowlist
                models: ["*"]
            group_metadata_key: "x-tenant-group"
            max_body_bytes: 33554432

          - filter: identity_header_guard
            prefix: "x-tenant-"

          - filter: model_to_header
            header: X-Model

          # Gemini uses Vertex's OpenAI-compatible endpoint on this listener.
          # ENMAAS_VERTEX_OPENAI_MODEL_TO_PROVIDER_FILTER

          - filter: router
            routes:
              # ENMAAS_VERTEX_OPENAI_ROUTER_ROUTE
              - path_prefix: "/"
                headers:
                  x-model: "rits/zai-org/glm-5-3"
                cluster: cb-glm
              - path_prefix: "/"
                cluster: openai

          # ENMAAS_VERTEX_OPENAI_PATH_REWRITE
          # ENMAAS_VERTEX_OPENAI_GCP_CREDENTIAL_FILTER

          - filter: external_metering
            metering_url: "http://metering-service:8080"
            # ENMAAS_VERTEX_METERING_INTERNAL_AUTH
            # core 0.5.5 blocks filter sub-requests to private IPs by default (SSRF guard)
            allow_private_endpoint: true
            timeout_seconds: 5
            feature_key: "inference-tokens"
            source: "praxis-ai"
            fail_open: true
            identity_header_prefix: "x-tenant-"
            # ENMAAS_METERING_MODEL_POLICY
            default_model: "unknown"

          - filter: stream_usage_inject

          - filter: token_count
            provider: openai
            # Codex Responses and OpenAI-compatible hosted models ride this
            # listener: response.completed
            # embeds the full response object and routinely exceeds the 64 KiB
            # default, so the scanner dropped the usage-carrying event and the
            # prod ledger booked Codex spend as 0 (canary incident 2026-09-17).
            # Match the old binary's hardcoded 1 MiB scratch.
            max_scratch_bytes: 1048576

          - filter: token_usage_headers

          - filter: credential_injection
            clusters:
              - name: openai
                header: Authorization
                env_var: OPENAI_API_KEY
                header_prefix: "Bearer "
                strip_client_credential: true
              - name: cb-glm
                header: Authorization
                env_var: CB_LITELLM_API_KEY
                header_prefix: "Bearer "
                strip_client_credential: true

          - filter: headers
            request_set:
              - name: "Host"
                value: "api.openai.com"
            request_remove:
              - x-praxis-ai-provider

          - filter: credential_injection
            clusters:
              - name: cb-glm
                header: Host
                value: "${CB_GLM_ENDPOINT}"
              # ENMAAS_VERTEX_OPENAI_HOST_OVERRIDE

          - filter: load_balancer
            clusters:
              - name: openai
                tls:
                  sni: "api.openai.com"
                # Same stale-connection guard as the anthropic cluster.
                idle_timeout_ms: 45000
                endpoints:
                  - "api.openai.com:443"
              - name: cb-glm
                tls:
                  sni: "${CB_GLM_ENDPOINT}"
                idle_timeout_ms: 45000
                endpoints:
                  - "${CB_GLM_ENDPOINT}:443"
              # ENMAAS_VERTEX_OPENAI_UPSTREAM_CLUSTER

      - name: benchmark
        filters:
          - filter: api_key_auth
            validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
            token_header: "x-api-key"
            cache_ttl_seconds: 300
            timeout_seconds: 5

          - filter: identity_header_guard
            prefix: "x-tenant-"

          - filter: router
            routes:
              - path_prefix: "/"
                cluster: llm-katan

          - filter: external_metering
            metering_url: "http://metering-service:8080"
            # ENMAAS_VERTEX_METERING_INTERNAL_AUTH
            allow_private_endpoint: true
            timeout_seconds: 5
            feature_key: "inference-tokens"
            source: "praxis-ai-benchmark"
            fail_open: true
            identity_header_prefix: "x-tenant-"
            # ENMAAS_METERING_MODEL_POLICY
            default_model: "unknown"

          - filter: token_count
            provider: anthropic

          - filter: token_usage_headers

          - filter: headers
            request_set:
              - name: "x-api-key"
                value: "llm-katan-anthropic-key"
              - name: "anthropic-version"
                value: "2023-06-01"

          - filter: load_balancer
            clusters:
              - name: llm-katan
                endpoints:
                  - "llm-katan:8000"

      # Anthropic Messages pipeline for the public gateway host. This chain
      # routes Claude/GLM models while the path-specific OpenAI listener
      # handles Chat Completions and Responses.
      - name: unified
        filters:
          - filter: api_key_auth
            validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
            token_header: "x-api-key"
            cache_ttl_seconds: 300
            timeout_seconds: 5
            conditions:
              - when:
                  headers:
                    anthropic-version: "2023-06-01"

          # OpenAI-compatible clients use Bearer auth, including GET /v1/models.
          # The Anthropic version header selects the Messages auth/catalog dialect.
          - filter: api_key_auth
            validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
            token_header: "authorization"
            cache_ttl_seconds: 300
            timeout_seconds: 5
            conditions:
              - unless:
                  headers:
                    anthropic-version: "2023-06-01"

          # Both clients share GET /v1/models. Select the envelope from the
          # protocol marker sent by Anthropic SDKs; OpenAI clients use the
          # standard OpenAI list envelope.
          # ENMAAS_VERTEX_ONLY_MODEL_CATALOG
          - filter: model_catalog
            format: anthropic
            path: /v1/models
            conditions:
              - when:
                  headers:
                    anthropic-version: "2023-06-01"
            models:
              - id: claude-opus-4-8
                display_name: "Claude Opus 4.8"
              - id: claude-sonnet-5
                display_name: "Claude Sonnet 5"
              - id: rits/zai-org/glm-5-3
                display_name: "GLM 5.3 (hosted via curvebender)"
              # EnMaaS adds its Vertex model catalog entry at this marker.
              # ENMAAS_VERTEX_MODEL_CATALOG

          - filter: model_catalog
            format: openai
            path: /v1/models
            conditions:
              - unless:
                  headers:
                    anthropic-version: "2023-06-01"
            models:
              - id: gpt-5.3-codex
                owned_by: openai
              - id: gpt-5.4
                owned_by: openai
              - id: gpt-5.6-luna
                owned_by: openai
              - id: rits/zai-org/glm-5-3
                owned_by: curvebender

          - filter: model_access
            mode: denylist
            models:
            overrides:
              - groups: ["octo-eng"]
                mode: allowlist
                models: ["*"]
            group_metadata_key: "x-tenant-group"
            max_body_bytes: 33554432

          # EnMaaS may narrow the public inference catalog and access policy to
          # the Vertex-hosted models without changing the shared base profile.
          # ENMAAS_VERTEX_ONLY_ACCESS

          - filter: identity_header_guard
            prefix: "x-tenant-"

          # Promote the request body's "model" field to X-Model so the router
          # can branch on it.
          - filter: model_to_header
            header: X-Model

          # EnMaaS resolves the stable public Vertex model ID to the internal
          # provider target before the Vertex dialect filter runs.
          # ENMAAS_VERTEX_MODEL_TO_PROVIDER_FILTER

          # Vertex translates only vertex/* target models and leaves every
          # other supplier's body untouched.
          # ENMAAS_VERTEX_FILTER

          - filter: router
            routes:
              # ENMAAS_VERTEX_ROUTER_ROUTE
              # Curvebender GLM-5.3 (LiteLLM, Anthropic-dialect translation
              # verified live 2026-09-21; see praxis-runbooks).
              - path_prefix: "/"
                headers:
                  x-model: "rits/zai-org/glm-5-3"
                cluster: cb-glm
              - path_prefix: "/"
                cluster: anthropic

          # ENMAAS_VERTEX_GCP_CREDENTIAL_FILTER

          # Rewrite content block types that some Anthropic-dialect
          # endpoints reject (server_tool_use, server_tool_result,
          # tool_reference inside tool_result). Harmless for
          # Anthropic-routed requests.
          - filter: content_normalize

          - filter: external_metering
            metering_url: "http://metering-service:8080"
            # ENMAAS_VERTEX_METERING_INTERNAL_AUTH
            # core 0.5.5 blocks filter sub-requests to private IPs by default (SSRF guard)
            allow_private_endpoint: true
            timeout_seconds: 5
            feature_key: "inference-tokens"
            source: "praxis-ai"
            fail_open: true
            identity_header_prefix: "x-tenant-"
            # ENMAAS_METERING_MODEL_POLICY
            default_model: "unknown"

          # Anthropic (Messages SSE) and OpenAI-compatible (Responses SSE) report
          # usage in different envelopes; provider: auto picks the dialect per
          # request path so both are metered instead of only Anthropic's.
          - filter: token_count
            provider: auto
            # Responses-API SSE events embed the full response object and
            # routinely exceed the 64 KiB default; match the old binary's
            # hardcoded 1 MiB scratch so Responses-API usage still meters.
            max_scratch_bytes: 1048576

          - filter: token_usage_headers

          - filter: credential_injection
            clusters:
              - name: anthropic
                header: x-api-key
                env_var: ANTHROPIC_API_KEY
                strip_client_credential: true
              - name: cb-glm
                header: Authorization
                header_prefix: "Bearer "
                # Shim: running image's clusters-schema lacks `file:` (added on
                # the 0.5.5+ branch code); uses env-from-secret instead, which
                # means key rotation needs a pod roll until the next image
                # release lands file: support — then flip to file:/etc/cb-litellm/key.
                env_var: CB_LITELLM_API_KEY
                strip_client_credential: true

          - filter: headers
            request_set:
              - name: "anthropic-version"
                value: "2023-06-01"
            request_remove:
              - x-praxis-ai-provider

          # Override Host for Anthropic: extra_request_headers (from
          # credential_injection) are applied after headers_to_set, so
          # this wins for anthropic-routed requests.
          - filter: credential_injection
            clusters:
              - name: anthropic
                header: Host
                value: "api.anthropic.com"
              - name: cb-glm
                header: Host
                value: "${CB_GLM_ENDPOINT}"
              # ENMAAS_VERTEX_HOST_OVERRIDE

          - filter: load_balancer
            clusters:
              - name: anthropic
                tls:
                  sni: "api.anthropic.com"
                idle_timeout_ms: 45000
                endpoints:
                  - "api.anthropic.com:443"
              - name: cb-glm
                tls:
                  sni: "${CB_GLM_ENDPOINT}"
                # Same stale-conn guard as the other upstreams.
                idle_timeout_ms: 45000
                endpoints:
                  - "${CB_GLM_ENDPOINT}:443"
              # ENMAAS_VERTEX_UPSTREAM_CLUSTER
---
# NOTE: provider-credentials Secret is created by deploy.sh from
# env vars (ANTHROPIC_API_KEY, OPENAI_API_KEY). Do NOT include it
# in this manifest — oc apply would overwrite real keys with placeholders.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  namespace: ai-gateway-dogfood
spec:
  replicas: 2
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: praxis
          image: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai:latest
          # Raise the soft nofile rlimit from the 1024 pod default: at high
          # concurrency (700 users) each in-flight stream holds ~2-3 fds
          # (client + upstream + subrequests), and 1024 caused
          # 'SocketError: No file descriptors available (os error 24)' ->
          # 502. 65536 <= the 524288 hard limit, so this succeeds non-root.
          command: ["/bin/sh", "-c", "ulimit -n 65536 && exec /usr/local/bin/praxis-ai -c /etc/praxis/praxis.yaml"]
          args: ["-c", "/etc/praxis/praxis.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8081
              name: openai
            - containerPort: 8082
              name: benchmark
            - containerPort: 8084
              name: unified
            - containerPort: 9901
              name: admin
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-credentials
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-credentials
                  key: OPENAI_API_KEY
            - name: CB_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-credentials
                  key: CB_LITELLM_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://127.0.0.1:9901/healthy
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: praxis-config
---
apiVersion: v1
kind: Service
metadata:
  name: praxis
  namespace: ai-gateway-dogfood
spec:
  selector:
    app: praxis
  ports:
    - name: openai
      port: 8081
      targetPort: 8081
    - name: benchmark
      port: 8082
      targetPort: 8082
    - name: unified
      port: 8084
      targetPort: 8084
