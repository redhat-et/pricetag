---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-gateway
  namespace: ai-gateway-dogfood
  labels:
    app: praxis
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  host: ${GATEWAY_HOST}
  path: /v1/messages
  to:
    kind: Service
    name: praxis
  port:
    targetPort: unified
  tls:
    termination: edge
---
