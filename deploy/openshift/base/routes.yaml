---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: ai-gateway-anthropic
  namespace: ai-gateway-dogfood
  labels:
    app: praxis
  annotations:
    haproxy.router.openshift.io/timeout: 300s
spec:
  to:
    kind: Service
    name: praxis
  port:
    targetPort: anthropic
  tls:
    termination: edge
---
