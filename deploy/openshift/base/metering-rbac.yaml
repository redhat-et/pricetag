apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metering-service
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [praxis-config]
    verbs: [get]
  - apiGroups: [maas.opendatahub.io]
    resources: [maassubscriptions]
    resourceNames: [dogfood-team]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metering-service
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metering-service
subjects:
  - kind: ServiceAccount
    name: default
