apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-stage-allow-internal
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-stage-allow-router
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [praxis, metering-service]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 8081 }
        - { protocol: TCP, port: 8084 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-stage-allow-api
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 172.30.0.1/32 }
      ports:
        - { protocol: TCP, port: 443 }
    - to:
        - ipBlock: { cidr: 172.20.0.1/32 }
      ports:
        - { protocol: TCP, port: 6443 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-stage-allow-cnpg-operator
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: aigateway-pg
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
