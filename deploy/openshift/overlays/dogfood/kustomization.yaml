apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-gateway-dogfood

resources:
  - namespace.yaml
  - maas-api-rbac-binding.yaml
  - ../../base

images:
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai
    newName: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai
    digest: ${VERTEX_IMAGE_DIGEST}

patches:
  - path: praxis-vertex-secret-mount.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
  - path: maas-api-dogfood-env.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: maas-api
