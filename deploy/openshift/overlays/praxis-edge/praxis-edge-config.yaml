      - filter: model_catalog
        format: openai
        path: /v1/models
        conditions:
          - unless:
              headers:
                anthropic-version: "2023-06-01"
        models:
          - id: gpt-5.3-codex
            owned_by: openai
          - id: gpt-5.4
            owned_by: openai
          - id: gpt-5.6-luna
            owned_by: openai
          - id: Inferact/Qwen3.8-Flash-Next-NVFP4
            owned_by: vllm
          - id: rits/zai-org/glm-5-3
            owned_by: curvebender

      - filter: model_access
        mode: denylist
        models:
        overrides:
          - groups: ["octo-eng"]
            mode: allowlist
            models: ["*"]
        group_metadata_key: "x-tenant-group"
        max_body_bytes: 33554432

      - filter: model_access
        mode: allowlist
        models:
          - claude-sonnet-4-5
          - claude-sonnet-5
          - claude-haiku-4-5
          - claude-opus-4-5
          - claude-opus-4-6
          - claude-sonnet-4-6
          - claude-opus-4-7
          - claude-opus-4-8
          - claude-opus-5
          - claude-opus-5-5
          - rits/zai-org/glm-5-3
        group_metadata_key: "x-tenant-group"
        max_body_bytes: 33554432
      - filter: identity_header_guard
        prefix: "x-tenant-"

      - filter: model_to_header
        header: X-Model

      # Map public Vertex model IDs to their provider target IDs.
      - filter: model_to_provider
        models:
          - model: claude-sonnet-4-5
            provider: vertex
            target_model: vertex/claude-sonnet-4-5
            paths:
              - /v1/messages
              - /v1/messages/count_tokens
          - model: claude-sonnet-5
            provider: vertex
            target_model: vertex/claude-sonnet-5
