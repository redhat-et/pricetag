              - /v1/messages/count_tokens
          - model: claude-opus-4-5
            provider: vertex
            target_model: vertex/claude-opus-4-5
            paths:
              - /v1/messages
              - /v1/messages/count_tokens
          - model: claude-opus-4-6
            provider: vertex
            target_model: vertex/claude-opus-4-6
            paths:
