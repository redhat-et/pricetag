            owned_by: vertex
          - id: claude-sonnet-4-6
            display_name: "Claude Sonnet 4.6 (Vertex AI)"
            owned_by: vertex
          - id: claude-opus-4-7
            display_name: "Claude Opus 4.7 (Vertex AI)"
