            owned_by: vertex
          - id: claude-opus-5
            display_name: "Claude Opus 5 (Vertex AI)"
            owned_by: vertex
          - id: claude-opus-5-5
            display_name: "Claude Opus 5.5 (Vertex AI)"
            owned_by: vertex
      
      - filter: model_catalog
        format: openai
        path: /v1/models
        conditions:
          - unless:
              headers:
                anthropic-version: "2023-06-01"
        models:
          - id: claude-sonnet-4-5
            owned_by: vertex
          - id: claude-sonnet-5
            owned_by: vertex
          - id: claude-haiku-4-5
            owned_by: vertex
          - id: claude-opus-4-5
            owned_by: vertex
          - id: claude-opus-4-6
            owned_by: vertex
          - id: claude-sonnet-4-6
            owned_by: vertex
          - id: claude-opus-4-7
            owned_by: vertex
          - id: claude-opus-4-8
            owned_by: vertex
          - id: claude-opus-5
            owned_by: vertex
          - id: claude-opus-5-5
            owned_by: vertex
      - filter: model_catalog
        format: anthropic
        path: /v1/models
        conditions:
          - when:
              headers:
                anthropic-version: "2023-06-01"
        models:
          - id: Inferact/Qwen3.8-Flash-Next-NVFP4
            display_name: "Qwen 3.8 Flash Next (hosted, $0.15/$0.47 per MTok)"
            owned_by: vllm
          - id: claude-opus-4-8
            display_name: "Claude Opus 4.8"
          - id: claude-sonnet-5
            display_name: "Claude Sonnet 5"
          - id: rits/zai-org/glm-5-3
            display_name: "GLM 5.3 (hosted via curvebender)"
          - id: claude-sonnet-4-5
            display_name: "Claude Sonnet 4.5 (Vertex AI)"
            owned_by: vertex
          - id: claude-sonnet-5
            display_name: "Claude Sonnet 5 (Vertex AI)"
            owned_by: vertex
          - id: claude-haiku-4-5
            display_name: "Claude Haiku 4.5 (Vertex AI)"
            owned_by: vertex
