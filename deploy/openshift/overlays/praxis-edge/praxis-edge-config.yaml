# Substitute uppercase variables before applying; keep Praxis's lowercase
# redirect placeholders unchanged.
admin:
  address: "127.0.0.1:9901"

# Permit the in-cluster service addresses used by upstreams.
insecure_options:
  allow_private_endpoints: true
  allow_private_upstreams: true
listeners:
  - name: http-redirect
    address: "0.0.0.0:8080"
    filter_chains:
      - https-redirect

  - name: edge
    address: "0.0.0.0:8443"
    filter_chains:
      - edge
    tls:
      certificates:
        - cert_path: /etc/praxis/tls/tls.crt
          key_path: /etc/praxis/tls/tls.key
          server_names: ["${GATEWAY_HOST}", "${DASHBOARD_HOST}"]
          # Use this certificate for a distinct legacy hostname too.
          default: true
      hot_reload: true

  # Local targets for API paths routed by the edge listener.
  - name: openai
    address: "127.0.0.1:8081"
    filter_chains:
      - openai

  - name: unified
    address: "127.0.0.1:8084"
    filter_chains:
      - unified

filter_chains:
  - name: https-redirect
    filters:
      - filter: redirect
        status: 308
        location: "https://${host}${path}${query}"
        allowed_hosts: ["${DASHBOARD_HOST}", "${GATEWAY_HOST}", "${LEGACY_GATEWAY_HOST}"]
        conditions:
          - unless:
              path_prefix: "/.well-known/acme-challenge/"

      # Forward HTTP-01 to the OpenShift router without redirecting to HTTPS.
      - filter: router
        routes:
          - { path_prefix: "/.well-known/acme-challenge/", host: "${DASHBOARD_HOST}", cluster: openshift-router }
          - { path_prefix: "/.well-known/acme-challenge/", host: "${GATEWAY_HOST}", cluster: openshift-router }
          - { path_prefix: "/.well-known/acme-challenge/", host: "${LEGACY_GATEWAY_HOST}", cluster: openshift-router }

      - filter: load_balancer
        clusters:
          - name: openshift-router
            endpoints: ["router-default.openshift-ingress.svc:80"]

  - name: edge
    filters:
      # Praxis cannot reproduce this Route's combined rate and connection limits.

      - filter: router
        routes:
          - { path_prefix: "/v1/messages", host: "${GATEWAY_HOST}", cluster: praxis-unified }
          - { path_prefix: "/v1/models", host: "${GATEWAY_HOST}", cluster: praxis-unified }
          - { path_prefix: "/v1/chat/completions", host: "${GATEWAY_HOST}", cluster: praxis-openai }
          - { path_prefix: "/v1/responses", host: "${GATEWAY_HOST}", cluster: praxis-openai }
          - { path_prefix: "/v1/conversations", host: "${GATEWAY_HOST}", cluster: praxis-openai }
          - { path_prefix: "/v1/messages", host: "${LEGACY_GATEWAY_HOST}", cluster: praxis-unified }
          - { path_prefix: "/v1/models", host: "${LEGACY_GATEWAY_HOST}", cluster: praxis-unified }
          - { path_prefix: "/v1/chat/completions", host: "${LEGACY_GATEWAY_HOST}", cluster: praxis-openai }
          - { path_prefix: "/v1/responses", host: "${LEGACY_GATEWAY_HOST}", cluster: praxis-openai }
          - { path_prefix: "/v1/conversations", host: "${LEGACY_GATEWAY_HOST}", cluster: praxis-openai }
          # Keep before the dashboard catch-all to retain this 60s timeout.
          - { path_prefix: "/welcome", host: "${DASHBOARD_HOST}", cluster: metering-service-welcome }
          - { path_prefix: "/", host: "${DASHBOARD_HOST}", cluster: metering-service }
      - filter: load_balancer
        clusters:
          - name: metering-service
            endpoints: ["metering-service:8080"]
          - name: metering-service-welcome
            # This is a per-read timeout, not a total request deadline.
            read_timeout_ms: 60000
            endpoints: ["metering-service:8080"]
          - name: praxis-openai
            # Match the Gateway Routes' timeout for long-running streams.
            read_timeout_ms: 300000
            endpoints: ["127.0.0.1:8081"]
          - name: praxis-unified
            read_timeout_ms: 300000
            endpoints: ["127.0.0.1:8084"]

  - name: openai
    filters:
      - filter: api_key_auth
        validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
        token_header: "authorization"
        cache_ttl_seconds: 300
        timeout_seconds: 5

      - filter: reject_upgrade
        # Prevent opaque 101 tunnels from bypassing usage metering.
        protocols:
          - websocket

      - filter: model_access
        mode: denylist
        models:
        overrides:
          - groups: ["octo-eng"]
            mode: allowlist
            models: ["*"]
        group_metadata_key: "x-tenant-group"
        max_body_bytes: 33554432

      - filter: identity_header_guard
        prefix: "x-tenant-"

      - filter: model_to_header
        header: X-Model

      - filter: router
        routes:
          - path_prefix: "/"
            headers:
              x-model: "Inferact/Qwen3.8-Flash-Next-NVFP4"
            cluster: qwen-flash
          - path_prefix: "/"
            headers:
              x-model: "rits/zai-org/glm-5-3"
            cluster: cb-glm
          - path_prefix: "/"
            cluster: openai

      - filter: external_metering
        metering_url: "http://metering-service:8080"
        internal_auth_file: /etc/praxis-secrets/metering-token
        # Praxis 0.5.5 blocks private filter endpoints by default.
        allow_private_endpoint: true
        timeout_seconds: 5
        feature_key: "inference-tokens"
        source: "praxis-ai"
        fail_open: true
        identity_header_prefix: "x-tenant-"

        default_model: "unknown"

      - filter: stream_usage_inject

      - filter: token_count
        provider: openai
        # Responses SSE events exceed the 64 KiB default; retain usage with 1 MiB.
        max_scratch_bytes: 1048576

      - filter: token_usage_headers

      - filter: credential_injection
        clusters:
          - name: openai
            header: Authorization
            env_var: OPENAI_API_KEY
            header_prefix: "Bearer "
            strip_client_credential: true
          - name: cb-glm
            header: Authorization
            env_var: CB_LITELLM_API_KEY
            header_prefix: "Bearer "
            strip_client_credential: true

      - filter: headers
        request_set:
          - name: "Host"
            value: "api.openai.com"

      - filter: credential_injection
        clusters:
          - name: qwen-flash
            header: Host
            value: "${QWEN_ENDPOINT}"
          - name: cb-glm
            header: Host
            value: "${CB_GLM_ENDPOINT}"

      - filter: load_balancer
        clusters:
          - name: openai
            tls:
              sni: "api.openai.com"
            idle_timeout_ms: 45000
            endpoints:
              - "api.openai.com:443"
          - name: qwen-flash
            tls:
              sni: "${QWEN_ENDPOINT}"
            idle_timeout_ms: 45000
            endpoints:
              - "${QWEN_ENDPOINT}:443"
          - name: cb-glm
            tls:
              sni: "${CB_GLM_ENDPOINT}"
            idle_timeout_ms: 45000
            endpoints:
              - "${CB_GLM_ENDPOINT}:443"

  # Anthropic Messages and OpenAI-compatible pipeline.
  - name: unified
    filters:
      - filter: api_key_auth
        validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
        token_header: "x-api-key"
        cache_ttl_seconds: 300
        timeout_seconds: 5
        conditions:
          - when:
              headers:
                anthropic-version: "2023-06-01"

      # Select auth format from the Anthropic protocol header.
      - filter: api_key_auth
        validate_url: "http://maas-api:8080/internal/v1/api-keys/validate"
        token_header: "authorization"
        cache_ttl_seconds: 300
        timeout_seconds: 5
        conditions:
          - unless:
              headers:
                anthropic-version: "2023-06-01"

      # Both APIs use /v1/models; select the response format by protocol header.
      - filter: model_catalog
        format: anthropic
        path: /v1/models
        conditions:
          - when:
              headers:
                anthropic-version: "2023-06-01"
        models:
          - id: claude-sonnet-4-5
