              - /v1/messages/count_tokens
          - model: claude-opus-4-7
            provider: vertex
            target_model: vertex/claude-opus-4-7
            paths:
              - /v1/messages
              - /v1/messages/count_tokens
          - model: claude-opus-4-8
            provider: vertex
            target_model: vertex/claude-opus-4-8
            paths:
              - /v1/messages
              - /v1/messages/count_tokens
          - model: claude-opus-5
            provider: vertex
            target_model: vertex/claude-opus-5
            paths:
              - /v1/messages
              - /v1/messages/count_tokens
          - model: claude-opus-5-5
            provider: vertex
            target_model: vertex/claude-opus-5-5
            paths:
              - /v1/messages
              - /v1/messages/count_tokens
      - filter: vertex
        project: "${VERTEX_PROJECT}"
        location: global
        beta_allowlist:
          - interleaved-thinking-2025-05-14
      - filter: router
        routes:
          - path_prefix: "/"
            headers:
              x-praxis-ai-provider: vertex
            cluster: vertex
          - path_prefix: "/"
            headers:
              x-model: "Inferact/Qwen3.8-Flash-Next-NVFP4"
            cluster: qwen-flash
          - path_prefix: "/"
            headers:
              x-model: "rits/zai-org/glm-5-3"
            cluster: cb-glm
          - path_prefix: "/"
            cluster: anthropic

      - filter: gcp_adc
        source: key_file
        credentials_file: /etc/vertex-sa/sa-key.json
        clusters: [vertex]
      # Normalize tool blocks that the vLLM and Qwen endpoints reject.
      - filter: content_normalize

      # Qwen rejects high/minimal effort values. Add Qwen-routed models here.
      - filter: reasoning_effort_map
        models: ["Inferact/Qwen3.8-Flash-Next-NVFP4"]

      - filter: external_metering
        metering_url: "http://metering-service:8080"
        internal_auth_file: /etc/praxis-secrets/metering-token
        allow_private_endpoint: true
        timeout_seconds: 5
        feature_key: "inference-tokens"
        source: "praxis-ai"
        fail_open: true
        identity_header_prefix: "x-tenant-"

        default_model: "unknown"

      # Auto-detect usage format for Anthropic Messages and Responses SSE.
      - filter: token_count
        provider: auto
        # Responses events exceed 64 KiB; retain usage with 1 MiB.
        max_scratch_bytes: 1048576

      - filter: token_usage_headers

      - filter: credential_injection
        clusters:
          - name: anthropic
            header: x-api-key
            env_var: ANTHROPIC_API_KEY
            strip_client_credential: true
          - name: cb-glm
            header: Authorization
            header_prefix: "Bearer "
            # The pinned image lacks file: support; rotate this env-backed key
            # with a pod rollout until the image supports file-based secrets.
            env_var: CB_LITELLM_API_KEY
            strip_client_credential: true

      - filter: headers
        request_set:
          - name: "Host"
            value: "${QWEN_ENDPOINT}"
          - name: "anthropic-version"
            value: "2023-06-01"
        request_remove:
          - x-praxis-ai-provider

      # credential_injection runs after headers, so set each provider's Host here.
      - filter: credential_injection
        clusters:
          - name: anthropic
            header: Host
            value: "api.anthropic.com"
          - name: cb-glm
            header: Host
            value: "${CB_GLM_ENDPOINT}"
          - name: vertex
            header: Host
            value: "aiplatform.googleapis.com"
      - filter: load_balancer
        clusters:
          - name: anthropic
            tls:
              sni: "api.anthropic.com"
            idle_timeout_ms: 45000
            endpoints:
              - "api.anthropic.com:443"
          - name: qwen-flash
            tls:
              sni: "${QWEN_ENDPOINT}"
            idle_timeout_ms: 45000
            endpoints:
              - "${QWEN_ENDPOINT}:443"
          - name: cb-glm
            tls:
              sni: "${CB_GLM_ENDPOINT}"
            idle_timeout_ms: 45000
            endpoints:
              - "${CB_GLM_ENDPOINT}:443"
          - name: vertex
            tls:
              sni: "aiplatform.googleapis.com"
            idle_timeout_ms: 45000
            endpoints:
              - "aiplatform.googleapis.com:443"
