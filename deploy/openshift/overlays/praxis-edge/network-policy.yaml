apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-edge-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# This namespace is a single test trust zone: keep app-to-app and CNPG
# replication traffic working, while requiring explicit rules at its boundary.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-edge-allow-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pricetag-test
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pricetag-test
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-edge-allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: ${KUBE_DNS_SERVICE_IP}/32
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
          podSelector:
            matchLabels:
              dns.operator.openshift.io/daemonset-dns: default
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-edge-allow-public-praxis
spec:
  podSelector:
    matchLabels:
      app: praxis
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 8443
  egress:
    # Public model providers use HTTPS.
    - ports:
        - protocol: TCP
          port: 443
    # Praxis forwards HTTP-01 challenge requests to the default router.
    - to:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 80
---
# Cert-manager's HTTP-01 Ingress is served by the OpenShift router. It points
# to a temporary solver Pod in this namespace on port 8089.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-edge-allow-acme-solver
spec:
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: "true"
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8089
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: praxis-edge-allow-app-kube-api
spec:
  podSelector:
    matchLabels:
