apiVersion: apps/v1
kind: Deployment
metadata:
  name: praxis
  labels:
    app: praxis
    pricetag.io/edge-authority: "true"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: praxis
  template:
    metadata:
      labels:
        app: praxis
        pricetag.io/edge-authority: "true"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
      containers:
        - name: praxis
          image: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai:latest
          command:
            [
              "/bin/sh",
              "-c",
              "ulimit -n 65536 && exec /usr/local/bin/praxis-ai -c /etc/praxis/praxis.yaml",
            ]
          args: ["-c", "/etc/praxis/praxis.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8443
              name: https
          env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-credentials
                  key: ANTHROPIC_API_KEY
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-credentials
                  key: OPENAI_API_KEY
            - name: CB_LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: provider-credentials
                  key: CB_LITELLM_API_KEY
          volumeMounts:
            - name: config
              mountPath: /etc/praxis
              readOnly: true
            - name: praxis-tls
              mountPath: /etc/praxis/tls
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 256Mi
          readinessProbe:
            exec:
              command:
                - wget
                - -qO-
                - http://127.0.0.1:9901/healthy
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: praxis-config
        - name: praxis-tls
          secret:
            secretName: praxis-certificate-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: praxis-lb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-healthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-interval: "10"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-timeout: "4"
    service.beta.kubernetes.io/aws-load-balancer-healthcheck-unhealthy-threshold: "2"
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    traffic-policy.network.alpha.openshift.io/local-with-fallback: ""
spec:
  selector:
    app: praxis
  type: LoadBalancer
  externalTrafficPolicy: Local
  sessionAffinity: None
  ports:
    - name: http
      port: 80
      targetPort: 8080
    - name: https
      port: 443
      targetPort: 8443
