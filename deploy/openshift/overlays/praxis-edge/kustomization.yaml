apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pricetag-test

# This profile deliberately owns its namespace and image choices. It reuses
# the shared application base, then removes its Route-based and old Praxis edge.
resources:
  - namespace.yaml
  - maas-api-rbac-binding.yaml
  - ../../base
  - praxis-deployment.yaml
  - praxis-certificate.yaml
  - network-policy.yaml

configMapGenerator:
  - name: praxis-config
    namespace: ai-gateway-dogfood
    behavior: replace
    files:
      - praxis.yaml=praxis-edge-config.yaml
    options:
      disableNameSuffixHash: true

images:
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/maas-api
    newName: image-registry.openshift-image-registry.svc:5000/pricetag-test/maas-api
    newTag: latest
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/metering-service
    newName: image-registry.openshift-image-registry.svc:5000/pricetag-test/metering-service
    newTag: latest
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai
    newName: image-registry.openshift-image-registry.svc:5000/pricetag-test/praxis-ai
    newTag: latest

patches:
  - target: { group: route.openshift.io, version: v1, kind: Route, name: ai-gateway }
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata: { name: ai-gateway }
  - target: { group: route.openshift.io, version: v1, kind: Route, name: ai-gateway-chat-completions }
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata: { name: ai-gateway-chat-completions }
  - target: { group: route.openshift.io, version: v1, kind: Route, name: ai-gateway-responses }
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata: { name: ai-gateway-responses }
  - target: { group: route.openshift.io, version: v1, kind: Route, name: ai-gateway-conversations }
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata: { name: ai-gateway-conversations }
  - target: { group: route.openshift.io, version: v1, kind: Route, name: ai-gateway-models }
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata: { name: ai-gateway-models }
  - target: { group: route.openshift.io, version: v1, kind: Route, name: dashboard }
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata: { name: dashboard }
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
      labelSelector: '!pricetag.io/edge-authority'
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: praxis }
  - target: { version: v1, kind: Service, name: praxis }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: praxis }
  - target: { group: apps, version: v1, kind: Deployment, name: llm-katan }
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata: { name: llm-katan }
  - target: { version: v1, kind: Service, name: llm-katan }
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata: { name: llm-katan }
