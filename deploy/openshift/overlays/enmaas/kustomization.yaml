apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enmaas

resources:
  - namespace.yaml
  - maas-api-rbac-binding.yaml
  - router-tls-rbac.yaml
  - network-policy.yaml
  - dashboard-routes.yaml
  - ../../base

images:
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/maas-api
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/maas-api
    digest: sha256:bbf5b77a3194ea477f236128d2f1499ac8b89957b0798047d1f97c311a069a97
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/metering-service
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/metering-service
    digest: ${METERING_IMAGE_DIGEST}
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/praxis-ai
    digest: ${VERTEX_IMAGE_DIGEST}

patches:
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: dashboard
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: dashboard
  # Every Route on the public gateway and dashboard hosts carries the host
  # certificate itself. The router serves one certificate per host, taken from
  # an admitted Route that has one; if only some Routes carry it, deleting those
  # breaks TLS for every path. Keeping the reference on all of them removes that
  # dependency and makes git the single source of truth for the hosts.
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      labelSelector: app=praxis
    patch: |-
      - op: add
        path: /spec/tls/externalCertificate
        value:
          name: api-enmaas-tls
      - op: add
        path: /spec/tls/insecureEdgeTerminationPolicy
        value: Redirect
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      labelSelector: app=metering-service
    patch: |-
      - op: add
        path: /spec/tls/externalCertificate
        value:
          name: dashboard-enmaas-tls
      - op: add
        path: /spec/tls/insecureEdgeTerminationPolicy
        value: Redirect
  - path: praxis-vertex-secret-mount.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llm-katan
  - target:
      version: v1
      kind: Service
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: llm-katan
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: praxis
      spec:
        template:
          spec:
            containers:
              - name: praxis
                ports:
                  - containerPort: 8082
                    $patch: delete
  - target:
      version: v1
      kind: Service
      name: praxis
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: praxis
      spec:
        ports:
          - port: 8082
            $patch: delete
          # Prometheus in enmaas-monitoring scrapes praxis.enmaas.svc:9901.
          # Reachable only when PRAXIS_PUBLIC_ADMIN=true; ingress to 9901 is
          # restricted by NetworkPolicy to the monitoring namespaces.
          - name: metrics
            port: 9901
            targetPort: 9901
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: maas-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MAAS_SUBSCRIPTION_MODE
          value: standalone
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: METRICS_SECURE
          value: "false"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metering-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MONTHLY_TOKEN_QUOTA
          value: "10000000000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: M2M_AUTH_REQUIRED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: M2M_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: metering-internal-auth
              key: token
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: READ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: metering-readonly-db-url
              key: READ_DATABASE_URL
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_CACHE_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_USE_ROLLUPS
          # Keep rollup reads fail-safe until the pinned metering image clears
          # maintenance errors and freshness state correctly.
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_CACHE_TTL_SECONDS
          value: "60"
