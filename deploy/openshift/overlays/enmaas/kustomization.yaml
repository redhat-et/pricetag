apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enmaas

resources:
  - namespace.yaml
  - maas-api-rbac-binding.yaml
  - router-tls-rbac.yaml
  - tls-certificates.yaml
  - nbari-pg-exporter.yaml
  - network-policy.yaml
  - dashboard-routes.yaml
  - ../../base

images:
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/maas-api
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/maas-api
    digest: sha256:bbf5b77a3194ea477f236128d2f1499ac8b89957b0798047d1f97c311a069a97
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/metering-service
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/metering-service
    digest: ${METERING_IMAGE_DIGEST}
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/praxis-ai
    digest: ${VERTEX_IMAGE_DIGEST}

patches:
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: dashboard
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: dashboard
  # Every Route on both public hosts carries the same multi-SAN certificate.
  # This also mitigates HAProxy 2.8.18 cross-certificate session resumption
  # until the OpenShift router carries the upstream 2.8.28 backport.
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      labelSelector: app=praxis
    patch: |-
      - op: add
        path: /spec/tls/externalCertificate
        value:
          name: enmaas-public-tls
      - op: add
        path: /spec/tls/insecureEdgeTerminationPolicy
        value: Redirect
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      labelSelector: app=metering-service
    patch: |-
      - op: add
        path: /spec/tls/externalCertificate
        value:
          name: enmaas-public-tls
      - op: add
        path: /spec/tls/insecureEdgeTerminationPolicy
        value: Redirect
  - path: praxis-vertex-secret-mount.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llm-katan
  - target:
      version: v1
      kind: Service
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: llm-katan
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: praxis
      spec:
        template:
          spec:
            containers:
              - name: praxis
                ports:
                  - containerPort: 8082
                    $patch: delete
                # Sizing for failover + Guaranteed QoS (request = limit):
                # per-pod 4Gi / 2 CPU reserved and non-evictable; one pod
                # absorbs the other's load at 4Gi / 2 CPU. Grounded in the
                # 2026-10-04 body-buffer load test: 256Mi OOM-killed at
                # 16MiB x 200 concurrent in-flight bodies; 8k users peaked
                # ~1.14Gi.
                resources:
                  limits:
                    cpu: "2"
                    memory: 4Gi
                  requests:
                    cpu: "2"
                    memory: 4Gi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: maas-api
    patch: |-
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
      # Production sizing agreed with the MaaS API owner. Keep requests low
      # for scheduling (observed steady-state usage is small), but leave enough
      # headroom for key-validation bursts and Go heap growth without an OOM or
      # CPU throttle. dogfood/test retain the smaller base limits.
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "1"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 2Gi
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
    patch: |-
      - op: add
        path: /spec/replicas
        value: 4
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
  - target:
      version: v1
      kind: Service
      name: praxis
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: praxis
      spec:
        ports:
          - port: 8082
            $patch: delete
          # Prometheus in enmaas-monitoring scrapes praxis.enmaas.svc:9901.
          # Reachable only when PRAXIS_PUBLIC_ADMIN=true; ingress to 9901 is
          # restricted by NetworkPolicy to the monitoring namespaces.
          - name: metrics
            port: 9901
            targetPort: 9901
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: maas-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MAAS_SUBSCRIPTION_MODE
          value: standalone
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: METRICS_SECURE
          value: "false"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metering-service
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 4
      # The global model catalog reads the allowlisted praxis-config through
      # the in-cluster Kubernetes API. The matching Role is restricted to that
      # ConfigMap (and the existing MaaS subscription read), so this token does
      # not grant broad namespace access.
      - op: replace
        path: /spec/template/spec/automountServiceAccountToken
        value: true
      - op: add
        path: /spec/strategy
        value:
          type: RollingUpdate
          rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MONTHLY_TOKEN_QUOTA
          value: "10000000000"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: M2M_AUTH_REQUIRED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: M2M_SHARED_SECRET
          valueFrom:
            secretKeyRef:
              name: metering-internal-auth
              key: token
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USER_MANAGEMENT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: metering-user-management-api
              key: token
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USAGE_REPORT_API_SECRET
          valueFrom:
            secretKeyRef:
              name: metering-partner-api
              key: usage-report
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USAGE_REPORT_API_SECRET_AIR
          valueFrom:
            secretKeyRef:
              name: metering-partner-api
              key: usage-report-air
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: USAGE_REPORT_API_SECRET_AIBT
          valueFrom:
            secretKeyRef:
              name: metering-partner-api
              key: usage-report-aibt
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_POLICY_API_SECRET
          valueFrom:
            secretKeyRef:
              name: metering-partner-api
              key: model-policy
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_POLICY_API_SECRET_AIBT
          valueFrom:
            secretKeyRef:
              name: metering-partner-api
              key: model-policy-aibt
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_CATALOG_API_SECRET
          valueFrom:
            secretKeyRef:
              name: metering-partner-api
              key: model-catalog
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MODEL_CATALOG_API_SECRET_AIBT
          valueFrom:
            secretKeyRef:
              name: metering-partner-api
              key: model-catalog-aibt
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: READ_DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: metering-readonly-db-url
              key: READ_DATABASE_URL
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DB_MAX_OPEN_CONNS
          value: "50"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DB_MAX_IDLE_CONNS
          value: "10"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DB_CONN_MAX_LIFETIME_SECONDS
          value: "14400"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_CACHE_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_USE_ROLLUPS
          # Keep rollup reads fail-safe until the pinned metering image clears
          # maintenance errors and freshness state correctly.
          value: "false"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_CACHE_TTL_SECONDS
          value: "60"
