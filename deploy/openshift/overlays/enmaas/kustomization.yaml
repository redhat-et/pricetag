apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enmaas

resources:
  - namespace.yaml
  - maas-api-rbac-binding.yaml
  - ../../base

images:
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/maas-api
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/maas-api
    newTag: standalone-1238aafa
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/metering-service
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/metering-service
    newTag: practice-05e9d104
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/praxis-ai
    newTag: ${VERTEX_IMAGE_TAG}

patches:
  - path: praxis-vertex-secret-mount.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llm-katan
  - target:
      version: v1
      kind: Service
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: llm-katan
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: praxis
      spec:
        template:
          spec:
            containers:
              - name: praxis
                ports:
                  - containerPort: 8082
                    $patch: delete
  - target:
      version: v1
      kind: Service
      name: praxis
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: praxis
      spec:
        ports:
          - port: 8082
            $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: maas-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MAAS_SUBSCRIPTION_MODE
          value: standalone
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: METRICS_SECURE
          value: "false"
