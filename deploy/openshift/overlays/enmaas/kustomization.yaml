apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enmaas

resources:
  - namespace.yaml
  - maas-api-rbac-binding.yaml
  - network-policy.yaml
  - ../../base

images:
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/maas-api
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/maas-api
    digest: sha256:bbf5b77a3194ea477f236128d2f1499ac8b89957b0798047d1f97c311a069a97
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/metering-service
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/metering-service
    digest: sha256:05e9d104d251287c000ff577842b56b26054aa2157a20a26cbee434a25ed2993
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/praxis-ai
    digest: sha256:66207f02fc8190359923bb8b24b10ff6090cc4b353caea90d06672611763ffb9

patches:
  - path: praxis-vertex-secret-mount.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llm-katan
  - target:
      version: v1
      kind: Service
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: llm-katan
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: ai-gateway-chat-completions
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ai-gateway-chat-completions
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: ai-gateway-responses
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ai-gateway-responses
  - target:
      group: route.openshift.io
      version: v1
      kind: Route
      name: ai-gateway-conversations
    patch: |-
      $patch: delete
      apiVersion: route.openshift.io/v1
      kind: Route
      metadata:
        name: ai-gateway-conversations
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: praxis
      spec:
        template:
          spec:
            containers:
              - name: praxis
                ports:
                  - containerPort: 8082
                    $patch: delete
  - target:
      version: v1
      kind: Service
      name: praxis
    patch: |-
      apiVersion: v1
      kind: Service
      metadata:
        name: praxis
      spec:
        ports:
          - port: 8082
            $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: maas-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MAAS_SUBSCRIPTION_MODE
          value: standalone
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: METRICS_SECURE
          value: "false"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metering-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MONTHLY_TOKEN_QUOTA
          value: "10000000000"
