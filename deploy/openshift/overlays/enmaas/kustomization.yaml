apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: enmaas

resources:
  - namespace.yaml
  - maas-api-rbac-binding.yaml
  - ../../base

images:
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/maas-api
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/maas-api
    newTag: standalone-1238aafa
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/metering-service
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/metering-service
    newTag: single-gateway-a1fd21c
  - name: image-registry.openshift-image-registry.svc:5000/ai-gateway-dogfood/praxis-ai
    newName: image-registry.openshift-image-registry.svc:5000/enmaas/praxis-ai
    newTag: practice-9be8880c

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: llm-katan
  - target:
      version: v1
      kind: Service
      name: llm-katan
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: llm-katan
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: praxis
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/ports/1
  - target:
      version: v1
      kind: Service
      name: praxis
    patch: |-
      - op: remove
        path: /spec/ports/1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: maas-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: MAAS_SUBSCRIPTION_MODE
          value: standalone
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: METRICS_SECURE
          value: "false"
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: metering-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_CACHE_ENABLED
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_CACHE_TTL_SECONDS
          value: "60"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: DASHBOARD_USE_ROLLUPS
          value: "true"
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: ROLLUP_REFRESH_SECONDS
          value: "300"
