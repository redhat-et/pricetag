apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard-welcome
  labels:
    app: metering-service
  annotations:
    haproxy.router.openshift.io/timeout: 60s
spec:
  host: ${DASHBOARD_HOST}
  path: /welcome
  to: { kind: Service, name: metering-service }
  port: { targetPort: 8080 }
  tls: { termination: edge }
---
