---
# Partner API paths are path-scoped to avoid exposing the metering service's
# entire listener. Authentication is a deployment responsibility: the
# preferred control is an OpenShift Route/AuthPolicy or equivalent edge
# authorizer. The Metering handlers intentionally do not implement app-level
# bearer-token authentication. A temporary exception requires explicit
# deployment-owner approval and private-network/egress restrictions; it is not
# suitable for unrestricted public exposure.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard-api-usage
  labels: { app: metering-service }
spec:
  host: ${DASHBOARD_HOST}
  path: /api/v1/usage
  to: { kind: Service, name: metering-service }
  port: { targetPort: 8080 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard-api-model-policies
  labels: { app: metering-service }
spec:
  host: ${DASHBOARD_HOST}
  path: /api/v1/model-policies
  to: { kind: Service, name: metering-service }
  port: { targetPort: 8080 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: dashboard-api-users
  labels: { app: metering-service }
  annotations:
    # This path can mint API keys behind the edge-authenticated route, so it gets
    # per-client rate limiting the read-only partner routes do not need.
    # Before the credential is handed out, also pin the callers' egress
    # ranges here:  haproxy.router.openshift.io/ip_whitelist: "<cidr> <cidr>"
    haproxy.router.openshift.io/rate-limit-connections: "true"
    haproxy.router.openshift.io/rate-limit-connections.concurrent-tcp: "10"
    haproxy.router.openshift.io/rate-limit-connections.rate-http: "60"
spec:
  host: ${DASHBOARD_HOST}
  path: /api/v1/users
  to: { kind: Service, name: metering-service }
  port: { targetPort: 8080 }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
