apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-internal
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: enmaas
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: enmaas
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-router-praxis
spec:
  podSelector:
    matchLabels:
      app: praxis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8084
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-router-dashboard
spec:
  podSelector:
    matchLabels:
      app: metering-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-monitoring-praxis
spec:
  podSelector:
    matchLabels:
      app: praxis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
      ports:
        - protocol: TCP
          port: 9901
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-praxis-https-egress
spec:
  podSelector:
    matchLabels:
      app: praxis
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-maas-api-https-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maas-api
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-maas-api-rds-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: maas-api
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: ${RDS_EGRESS_CIDR}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-metering-rds-egress
spec:
  podSelector:
    matchLabels:
      app: metering-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: ${RDS_EGRESS_CIDR}
      ports:
        - protocol: TCP
          port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-postgres-https-egress
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: aigateway-pg
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 443
---
# The EnMaaS Prometheus stack lives in the `enmaas-monitoring` namespace
# (deployments/enmaas/monitoring in redhat-et/open-models), NOT in
# openshift-monitoring - so enmaas-allow-monitoring-praxis above does not
# cover it. Without this rule the default-deny policy silently blackholes
# every scrape of this namespace (praxis, maas-api, rds-postgres-exporter
# all went down on 2026-09-30 when default-deny landed).
# Ports: 9187 postgres exporters, 9901 praxis admin/metrics,
#        9090 maas-api metrics, 8080 metering-service (future).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-monitoring-scrape
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: enmaas-monitoring
      ports:
        - protocol: TCP
          port: 9187
        - protocol: TCP
          port: 9901
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8080
---
# postgres_exporter for the RDS metering DB (Deployment lives in
# redhat-et/open-models deployments/enmaas/monitoring/09-rds-exporter.yaml,
# runs in this namespace so annotation-driven scrape discovery finds it).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: enmaas-allow-rds-exporter-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: rds-postgres-exporter
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: ${RDS_EGRESS_CIDR}
      ports:
        - protocol: TCP
          port: 5432
