- filter: model_catalog
  format: openai
  path: /v1/models
  conditions:
    - unless:
        headers:
          anthropic-version: "2023-06-01"
  models:
    # These models are served by the non-Vertex routes in the same Praxis
    # deployment. Keep them in the first OpenAI-format catalog: Praxis
    # answers /v1/models from the first matching catalog rather than merging
    # duplicate catalog filters.
    - id: gpt-5.3-codex
      display_name: "GPT-5.3 Codex (OpenAI)"
      owned_by: openai
    - id: gpt-5.4
      display_name: "GPT-5.4 (OpenAI)"
      owned_by: openai
    - id: gpt-5.6-luna
      display_name: "GPT-5.6 Luna (OpenAI)"
      owned_by: openai
