# Public TLS for the EnMaaS hostnames (api/dashboard .enmaas.devshift.net).
#
# The cluster's default router certificate only covers
# *.apps.rosa.<cluster>...  - it does NOT cover devshift.net names, so every
# client hitting the public hostnames fails with ERR_TLS_CERT_ALTNAME_INVALID
# until a matching certificate is attached to the Routes.
#
# Issuance: ACME HTTP-01 through the public router (see
# deploy/openshift/cert-manager/ for the one-time cluster bootstrap).
# DNS-01 is deliberately NOT used: the devshift.net zone lives in the app-sre
# AWS account (managed in app-interface, data/aws/app-sre/dns/devshift.net.yaml),
# so this cluster cannot write the TXT records. HTTP-01 needs only the public
# CNAME that already points at this router.
#
# Wiring: Route.spec.tls.externalCertificate references the issued Secret;
# the router reloads renewals automatically, which is why the router service
# account needs read access to these two Secrets (RoleBinding below).
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: api-enmaas-devshift-net
  labels:
    app: praxis
spec:
  secretName: api-enmaas-tls
  commonName: ${GATEWAY_HOST}
  dnsNames:
    - ${GATEWAY_HOST}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h    # 90d
  renewBefore: 720h  # renew at 60d
  secretTemplate:
    labels:
      app: praxis
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dashboard-enmaas-devshift-net
  labels:
    app: metering-service
spec:
  secretName: dashboard-enmaas-tls
  commonName: ${DASHBOARD_HOST}
  dnsNames:
    - ${DASHBOARD_HOST}
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  duration: 2160h
  renewBefore: 720h
  secretTemplate:
    labels:
      app: metering-service
---
# Route.spec.tls.externalCertificate requires the ingress router's service
# account to read the referenced Secrets in this namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: router-read-enmaas-tls
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - api-enmaas-tls
      - dashboard-enmaas-tls
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: router-read-enmaas-tls
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: router-read-enmaas-tls
subjects:
  - kind: ServiceAccount
    name: router
    namespace: openshift-ingress
