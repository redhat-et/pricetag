name: Static security baseline

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Static security baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gettext-base
          yq_version=v4.44.3
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${yq_version}/yq_linux_amd64" \
            -o /tmp/yq
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Run static security baseline
        run: ./tools/security-static-validate.sh
